[project]
name = "hackyeah2026"
version = "0.1.0"
description = "Authorization and policy proxy API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32.0,<0.33",
]

[project.scripts]
astbest = "app.server:run"
asbest = "app.server:run"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "anyio>=4.6,<4.10",
    "httpx>=0.27.2,<0.28",
    "mypy>=1.13,<2",
    "pytest>=8.3.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
